name: Fix three Believers hymn typos

on:
  push:
    branches:
      - chatgpt/pwa-foundation
    paths:
      - .fix-three-believers-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pwa-foundation
          fetch-depth: 1
      - name: Apply three verified corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('data/believers.html')
          text = path.read_text(encoding='utf-8')

          changes = {
              66: [("Of all Egyptia's treasure!", "Of all Egypt's treasure!")],
              166: [('From the accursd load.', 'From the accursed load.')],
              176: [("O Christ, it woke' gainst Thee!", "O Christ, it woke 'gainst Thee!")],
          }

          for hymn, replacements in changes.items():
              m = re.search(rf'<article class="hymn" id="hymn-{hymn}".*?</article>', text, re.S)
              if not m:
                  raise SystemExit(f'Hymn {hymn} not found')
              article = m.group(0)
              for old, new in replacements:
                  if article.count(old) != 1:
                      raise SystemExit(f'Hymn {hymn}: expected one {old!r}, found {article.count(old)}')
                  article = article.replace(old, new, 1)
              text = text[:m.start()] + article + text[m.end():]

          if len(re.findall(r'<article class="hymn"', text)) != 465:
              raise SystemExit('Hymn count changed unexpectedly')
          path.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          index_text = idx.read_text(encoding='utf-8')
          if 'v1.1.2' not in index_text:
              raise SystemExit('Expected app version v1.1.2 not found')
          idx.write_text(index_text.replace('v1.1.2', 'v1.1.3', 1), encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          if 'mgh-hymnbook-v23' not in sw_text:
              raise SystemExit('Expected cache v23 not found')
          sw.write_text(sw_text.replace('mgh-hymnbook-v23', 'mgh-hymnbook-v24', 1), encoding='utf-8')
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-three-believers.yml .fix-three-believers-trigger
          git add data/believers.html index.html service-worker.js
          git commit -m "Fix three verified Believers hymn typos"
          git push origin HEAD:chatgpt/pwa-foundation
