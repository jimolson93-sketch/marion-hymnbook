name: Apply Believers proofreading corrections

on:
  push:
    branches:
      - chatgpt/pwa-foundation
    paths:
      - .proofread-believers-trigger

permissions:
  contents: write

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pwa-foundation
          fetch-depth: 1
      - name: Apply verified corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('data/believers.html')
          text = path.read_text(encoding='utf-8')

          corrections = {
              6: [('thankfullness', 'thankfulness')],
              10: [('Has gather thick and thundered loud,', 'Has gathered thick and thundered loud,')],
              12: [('watchfullness', 'watchfulness'), ('faithfullness', 'faithfulness')],
              29: [('Since thou has much to learn', 'Since thou hast much to learn')],
              36: [('Joys lights thine eyes.', 'Joy lights thine eyes.')],
              86: [
                  ('<p class="verse indent-1">In me is only ill; My ill</p><p class="verse indent-1">but draws His goodness forth,</p>',
                   '<p class="verse indent-1">In me is only ill;</p><p class="verse indent-1">My ill but draws His goodness forth,</p>')
              ],
              137: [('As Thou our crown wilt be; Be', 'As Thou our crown wilt be;')],
              146: [('<p class="verse indent-1">of all rich dowries best;</p>', '<p class="verse indent-1">Of all rich dowries best;</p>')],
              155: [
                  ('<p class="verse main"><span class="verse-number">4.</span> Who is this who comes to meet</p><p class="verse indent-1">me On the desert way,</p>',
                   '<p class="verse main"><span class="verse-number">4.</span> Who is this who comes to meet me</p><p class="verse indent-1">On the desert way,</p>')
              ],
              165: [('He prayer oft mixed with tears before,', 'The prayer oft mixed with tears before,')],
              173: [('Upon the alter laid.', 'Upon the altar laid.')],
              176: [('But Thou has drained the last dark drop,', 'But Thou hast drained the last dark drop,')],
              187: [('faithfullness', 'faithfulness')],
              202: [('unfaithfullness', 'unfaithfulness'), ('Thy faithfullness to God.', 'Thy faithfulness to God.')],
              205: [('Thou has bought us', 'Thou hast bought us')],
              254: [('Thou wilt head us,', 'Thou wilt heed us,')],
              279: [
                  ('<p class="verse indent-1">Who tends with sweet, unwearied</p><p class="verse indent-1">care The flock for which He bled.</p>',
                   '<p class="verse indent-1">Who tends with sweet, unwearied care</p><p class="verse indent-1">The flock for which He bled.</p>')
              ],
              303: [
                  ('<p class="verse main"><span class="verse-number">4.</span> Lord Jesus, teach us more</p><p class="verse indent-1">and more On Thee alone to cast our care;</p>',
                   '<p class="verse main"><span class="verse-number">4.</span> Lord Jesus, teach us more and more</p><p class="verse indent-1">On Thee alone to cast our care;</p>')
              ],
              308: [('Thou has redeemed us with Thy blood,', 'Thou hast redeemed us with Thy blood,')],
              320: [('When langour and disease invade', 'When languor and disease invade'), ('faithfullness', 'faithfulness')],
              328: [('Thou has made us kings and priests', 'Thou hast made us kings and priests')],
              371: [('awfullness', 'awfulness')],
              393: [('Thou has saved and cleansed and filled me,', 'Thou hast saved and cleansed and filled me,')],
              423: [('As Thou was here below;', 'As Thou wast here below;')],
              432: [('Be stirr?d up His holy name', "Be stirr'd up His holy name")],
              437: [('Thou has taught', 'Thou hast taught')],
              438: [('faithfullness', 'faithfulness')],
              444: [('forgetfullness', 'forgetfulness')],
          }

          def article_bounds(doc, hymn):
              pat = re.compile(rf'<article class="hymn" id="(?:believers-)?hymn-{hymn}".*?</article>', re.S)
              m = pat.search(doc)
              if not m:
                  raise SystemExit(f'Hymn {hymn}: article not found')
              return m.start(), m.end(), m.group(0)

          applied = []
          for hymn, changes in corrections.items():
              start, end, article = article_bounds(text, hymn)
              for old, new in changes:
                  count = article.count(old)
                  if count != 1:
                      raise SystemExit(f'Hymn {hymn}: expected exactly 1 occurrence of {old!r}, found {count}')
                  article = article.replace(old, new, 1)
                  applied.append((hymn, old, new))
              text = text[:start] + article + text[end:]

          count = len(re.findall(r'<article class="hymn"', text))
          if count != 465:
              raise SystemExit(f'Expected 465 hymns after edits, found {count}')
          path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          idx = index.read_text(encoding='utf-8')
          if 'v1.1.1' not in idx:
              raise SystemExit('Expected app version v1.1.1 not found')
          index.write_text(idx.replace('v1.1.1', 'v1.1.2', 1), encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "mgh-hymnbook-v22" not in sw_text:
              raise SystemExit('Expected cache v22 not found')
          sw.write_text(sw_text.replace('mgh-hymnbook-v22', 'mgh-hymnbook-v23', 1), encoding='utf-8')

          print(f'Applied {len(applied)} verified corrections across {len(corrections)} hymns.')
      - name: Commit corrections and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/proofread-believers.yml .proofread-believers-trigger
          git add data/believers.html index.html service-worker.js
          git commit -m "Correct verified Believers hymn typos"
          git push origin HEAD:chatgpt/pwa-foundation
