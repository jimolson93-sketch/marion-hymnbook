name: Build Believers hymn data

on:
  push:
    branches:
      - chatgpt/pwa-foundation
    paths:
      - data/believers-build/READY

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pwa-foundation
      - name: Rebuild single Believers data file
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, re, shutil

          build = Path('data/believers-build')
          parts = sorted(build.glob('part-*.txt'))
          if not parts:
              raise SystemExit('No Believers build parts found')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          count = len(re.findall(r'<article class="hymn"', html))
          if count != 465:
              raise SystemExit(f'Expected 465 hymns, found {count}')
          if 'id="believers-hymn-1"' not in html or 'id="believers-hymn-465"' not in html:
              raise SystemExit('Believers hymn range validation failed')
          Path('data/believers.html').write_text(html, encoding='utf-8')
          shutil.rmtree(build)
      - name: Commit generated Believers file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/believers.html data/believers-build
          git commit -m "Build single Believers hymn data file"
          git push origin HEAD:chatgpt/pwa-foundation
