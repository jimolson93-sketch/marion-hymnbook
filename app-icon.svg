<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="MGH Hymn Book app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c9386"/>
      <stop offset="1" stop-color="#667066"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#202820" flood-opacity=".32"/>
    </filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="175" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="168" fill="none" stroke="#556057" stroke-width="6" opacity=".55"/>
  <g fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <text x="512" y="600" font-size="420" font-weight="700" letter-spacing="-24">MGH</text>
    <rect x="116" y="648" width="792" height="7" rx="3.5" fill="#fff"/>
    <text x="512" y="765" font-size="86" font-weight="500" letter-spacing="24">HYMN BOOK</text>
  </g>
</svg>
